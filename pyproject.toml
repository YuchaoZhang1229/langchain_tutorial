[project]
name = "langchain-tutorial"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "arxiv==2.3.0",
    "chromadb>=1.5.9",
    "dashscope>=1.27.7",
    "doclayout-yolo>=0.0.4",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "gradio==5.49.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community==0.4.1",
    "langchain-milvus>=0.4.0",
    "langchain-mineru>=0.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai",
    "langchain-deepseek",
    "langserve>=0.3.3",
    "mineru[core]==2.7.5",
    "mineru-open-sdk>=0.2.5",
    "mineru-vl-utils==0.1.22",
    "mypy-extensions>=1.1.0",
    "mysqlclient==2.2.7",
    "notebook>=7.6.3",
    "ollama>=0.6.3",
    "onnxruntime>=1.31.1",
    "openai==2.2.0",
    "pydantic[email]>=2.11.10",
    "pymilvus>=3.0.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "pyvis>=0.3.2",
    "rank-bm25>=0.2.2",
    "rapid-table>=3.0.2",
    "redis>=8.1.0",
    "sse-starlette>=3.5.0",
    "tabulate>=0.10.0",
    "sentence-transformers==4.0.2",
    "ultralytics>=8.4.197",
    "uvicorn>=0.54.0",
    "langchain-mcp-adapters>=0.3.2",
    "fastmcp>=3.4.0",
    "langchain-tavily>=0.2.18",
    "ragas>=0.4.3",
]

[project.scripts]
langchain-tutorial = "langchain_tutorial:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 清华镜像对 llama-index 系列更新滞后，追加阿里云镜像以获取较新版本
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
